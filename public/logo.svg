<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- v3 terminal favicon: black canvas + `>` prompt + blinking cursor block -->
  <style>
    .cursor { animation: blink 1.1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="64" height="64" fill="#000000" />
  <rect x="1.5" y="1.5" width="61" height="61" fill="none" stroke="#303033" stroke-width="3" />

  <!-- `>` chevron -->
  <polyline
    points="16,20 30,32 16,44"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- terminal cursor block -->
  <rect class="cursor" x="39" y="19" width="14" height="26" fill="#FFFFFF" />
</svg>
